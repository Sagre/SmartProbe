# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=10
CONFIG_NET_SOCKETS=y
CONFIG_HTTP_CLIENT=y

# Network Buffers and Contexts
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10

# DHCP and Network Config
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=30

# WiFi
CONFIG_WIFI=y
CONFIG_INIT_STACKS=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_L2_ETHERNET=y

# MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_SERVER_ADDR="192.168.2.197"
CONFIG_MQTT_SERVER_PORT=1883
CONFIG_MQTT_CONNECT_TIMEOUT_MS=2000
CONFIG_MQTT_CONNECT_TRIES=10
CONFIG_MQTT_BUFFER_SIZE=128

# Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_POLICY_DEFAULT=n
CONFIG_PM_POLICY_CUSTOM=y
CONFIG_POWEROFF=y
CONFIG_RETAINED_MEM=y

# Logging and Console
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Miscellaneous
CONFIG_POSIX_API=y
CONFIG_I2C=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y